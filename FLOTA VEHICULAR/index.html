<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e5aa8">
<title>Flota Vehicular · ESE HRNO</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="iconos/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="iconos/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">

<!-- iPhone y iPad no leen el manifiesto: la pantalla completa, el nombre bajo
     el icono y el color de la barra de estado se piden con estas etiquetas. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flota HRNO">
<meta name="application-name" content="Flota HRNO">
<meta name="description" content="Gestión de vehículos de Misión Médica — ESE Hospital Regional Noroccidental.">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --surface-2:#f7f9fb; --surface-3:#eef1f5;
  --border:#dde3ea; --border-soft:#e9edf2;
  --text:#16202b; --text-soft:#4a5867; --muted:#75828f;
  --azul:#1e5aa8; --azul-dark:#15447f; --azul-glow:rgba(30,90,168,.09);
  --verde:#0a7d57; --verde-glow:rgba(10,125,87,.10);
  --rojo:#c22e24; --rojo-glow:rgba(194,46,36,.09);
  --ambar:#a2620a; --ambar-glow:rgba(162,98,10,.11);
  --morado:#6d3aad; --morado-glow:rgba(109,58,173,.09);
  --r:10px; --r-lg:14px;
  --sh-sm:0 1px 2px rgba(16,32,48,.06),0 1px 3px rgba(16,32,48,.05);
  --sh-md:0 4px 12px rgba(16,32,48,.08),0 2px 4px rgba(16,32,48,.05);
  --sh-lg:0 12px 32px rgba(16,32,48,.13);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:400 15px/1.5 'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;margin:0;line-height:1.25}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
a{color:var(--azul)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ── Estructura ─────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem;
  padding-top:calc(.6rem + env(safe-area-inset-top));
}
.topbar .marca{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:.9rem;letter-spacing:-.01em}
.topbar .marca svg{color:var(--azul);flex:none}
/* El logotipo va como imagen: el emblema de la marca no es un trazo de un
   color, lleva el azul, el blanco y el amarillo. Es el mismo archivo que el
   teléfono muestra en el icono instalado, así el conductor reconoce lo mismo
   dentro y fuera de la aplicación. */
.marca-logo{flex:none;display:block}   /* las esquinas ya vienen redondeadas en el PNG */
.topbar .sub{color:var(--muted);font-size:.72rem;font-weight:500;display:block;letter-spacing:0}
.topbar .der{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.chip-rol{
  font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:.2rem .5rem;border-radius:999px;background:var(--azul-glow);
  color:var(--azul);border:1px solid rgba(30,90,168,.2);white-space:nowrap;
}
.nav{
  display:flex;gap:.25rem;padding:0 .75rem;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  border:0;background:none;padding:.7rem .7rem;font:600 .82rem 'Inter',sans-serif;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  white-space:nowrap;display:flex;align-items:center;gap:.35rem;
}
.nav button:hover{color:var(--text-soft)}
.nav button.on{color:var(--azul);border-bottom-color:var(--azul)}
main{max-width:1240px;margin:0 auto;padding:1rem}
.vista{display:none;animation:sube .22s ease}
.vista.on{display:block}
@keyframes sube{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.cab p{margin:.2rem 0 0;color:var(--muted);font-size:.82rem}

/* ── Tarjetas ───────────────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);padding:1rem;
}
.card+.card{margin-top:.85rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:.85rem 1rem;box-shadow:var(--sh-sm)}
.kpi .et{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi .val{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin-top:.15rem;font-variant-numeric:tabular-nums}
.kpi .pie{font-size:.74rem;color:var(--muted);margin-top:.1rem}
.kpi.azul .val{color:var(--azul)} .kpi.verde .val{color:var(--verde)}
.kpi.ambar .val{color:var(--ambar)} .kpi.rojo .val{color:var(--rojo)}

/* ── Formularios ────────────────────────────────────────────── */
label.lb{display:block;font-size:.74rem;font-weight:700;color:var(--text-soft);margin-bottom:.28rem;letter-spacing:.01em}
.inp,select.inp,textarea.inp{
  width:100%;padding:.55rem .7rem;border:1px solid var(--border);border-radius:var(--r);
  background:var(--surface-2);color:var(--text);font:400 .9rem 'Inter',sans-serif;
}
.inp:focus{outline:0;border-color:var(--azul);background:#fff;box-shadow:0 0 0 3px var(--azul-glow)}
.campo{margin-bottom:.75rem}
.req{color:var(--rojo)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.55rem .95rem;border:1px solid transparent;border-radius:var(--r);
  font:600 .87rem 'Inter',sans-serif;cursor:pointer;transition:filter .15s,transform .1s;
  background:var(--azul);color:#fff;
}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.btn.sec{background:var(--surface);color:var(--text-soft);border-color:var(--border)}
.btn.sec:hover{background:var(--surface-3)}
.btn.verde{background:var(--verde)} .btn.rojo{background:var(--rojo)}
.btn.ambar{background:var(--ambar)} .btn.sm{padding:.35rem .6rem;font-size:.78rem}
.btn.bloque{width:100%}

/* ── Botones grandes del conductor ──────────────────────────── */
.btn-gigante{
  width:100%;border:0;border-radius:18px;padding:1.5rem 1rem;cursor:pointer;
  color:#fff;font:800 1.3rem 'Inter',sans-serif;letter-spacing:-.01em;
  display:flex;flex-direction:column;align-items:center;gap:.35rem;
  box-shadow:var(--sh-md);transition:transform .1s,filter .15s;
}
.btn-gigante:active{transform:scale(.98)}
.btn-gigante:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-gigante small{font-weight:600;font-size:.8rem;opacity:.9;letter-spacing:0}
.btn-gigante.salida{background:linear-gradient(160deg,#0e9468,#0a7d57)}
.btn-gigante.llegada{background:linear-gradient(160deg,#2a6cc0,#1e5aa8)}

/* ── Tablas ─────────────────────────────────────────────────── */
.tabla-env{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{
  text-align:left;padding:.6rem .7rem;background:var(--surface-2);color:var(--muted);
  font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;
}
td{padding:.55rem .7rem;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.placa{font-weight:700;letter-spacing:.02em}

.etq{
  display:inline-block;padding:.13rem .45rem;border-radius:6px;font-size:.7rem;font-weight:700;
  border:1px solid;white-space:nowrap;
}
.etq.verde{background:var(--verde-glow);color:var(--verde);border-color:rgba(10,125,87,.25)}
.etq.azul{background:var(--azul-glow);color:var(--azul);border-color:rgba(30,90,168,.25)}
.etq.rojo{background:var(--rojo-glow);color:var(--rojo);border-color:rgba(194,46,36,.25)}
.etq.ambar{background:var(--ambar-glow);color:var(--ambar);border-color:rgba(162,98,10,.28)}
.etq.morado{background:var(--morado-glow);color:var(--morado);border-color:rgba(109,58,173,.25)}
.etq.gris{background:var(--surface-3);color:var(--muted);border-color:var(--border)}

/* ── Itinerario del conductor ────────────────────────────────
   Una tarjeta por día, en una sola columna: se lee de un vistazo, con el
   pulgar, y sin desplazamiento lateral. Nada que ver con la matriz de
   Coordinación, que es para editar en un computador. */
.dia-itin{
  display:flex;align-items:center;gap:.8rem;
  padding:.7rem .85rem;margin-bottom:.5rem;
}
.dia-itin.libre{background:var(--surface-2);box-shadow:none}
.dia-itin.es-hoy{border-left:4px solid var(--azul)}
.dia-fecha{flex:none;width:4.6rem;text-align:center}
.dia-nombre{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.dia-num{font-size:.95rem;font-weight:800;letter-spacing:-.02em;margin-top:.1rem;white-space:nowrap}
.dia-itin.es-hoy .dia-nombre{color:var(--azul)}
.dia-cuerpo{flex:1;min-width:0}
.dia-destino{font-weight:700;font-size:.95rem;line-height:1.25}
.dia-sub{font-size:.76rem;color:var(--text-soft);margin-top:.1rem}
.dia-obs{font-size:.72rem;color:var(--muted);margin-top:.25rem;font-style:italic}
.dia-libre{font-size:.85rem;color:var(--muted)}
.dia-etq{flex:none;display:flex;flex-direction:column;gap:.25rem;align-items:flex-end}

.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chips .chip{
  font:600 .76rem/1 inherit;padding:.45rem .7rem;border-radius:999px;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);color:var(--text-soft);
}
.chips .chip.on{background:var(--azul);border-color:var(--azul);color:#fff}

/* ── Itinerario ─────────────────────────────────────────────── */
.itin-celda{
  min-width:112px;padding:.4rem .45rem;border-radius:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface-2);font-size:.74rem;
  transition:border-color .15s,box-shadow .15s;
}
.itin-celda:hover{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-glow)}
.itin-celda .dest{font-weight:700;display:block;line-height:1.25;color:var(--text)}
.itin-celda .tj{font-size:.63rem;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.itin-celda.vacia{background:transparent;border-style:dashed;color:var(--muted);text-align:center}
.itin-celda.ebs{border-left:3px solid var(--azul)}
.itin-celda.jornada{border-left:3px solid var(--morado)}
.itin-celda.vacunacion{border-left:3px solid var(--verde)}
.itin-celda.disponible{border-left:3px solid var(--muted)}
.itin-celda.traslado_ciudad{border-left:3px solid var(--ambar)}
.itin-celda.administrativo{border-left:3px solid var(--border)}
.itin-celda .marcas{display:flex;gap:.2rem;align-items:center;margin-top:.2rem}
.punto{width:7px;height:7px;border-radius:50%;display:inline-block}
.punto.ok{background:var(--verde)} .punto.no{background:var(--border)}
.mini-cambios{font-size:.6rem;color:var(--ambar);font-weight:700}

/* Barra de desplazamiento espejo, encima de la tabla del itinerario */
.scroll-arriba{overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:.3rem}
.scroll-arriba>div{height:1px}

/* Arrastrar y soltar en la matriz */
.itin-celda[draggable="true"]{cursor:grab}
.itin-celda.arrastrando{opacity:.4;cursor:grabbing}
.itin-celda.destino-ok{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-glow);background:var(--verde-glow)}
.itin-celda.destino-cambio{border-color:var(--ambar);box-shadow:0 0 0 3px var(--ambar-glow);background:var(--ambar-glow)}
.itin-celda.destino-no{border-color:var(--rojo);box-shadow:0 0 0 3px var(--rojo-glow);cursor:not-allowed}
.itin-celda.bloqueada{border-left-width:3px;background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(16,32,48,.035) 5px,rgba(16,32,48,.035) 10px)}

/* ── Días fuera de servicio (D33) ────────────────────────────────────
   Un vehículo parado tiene que verse en la matriz aunque ese día no haya nada
   programado: si no, la casilla vacía invita a adjudicarle un traslado que no
   puede hacer. Las rayas rojas se leen de un vistazo a lo ancho de la tabla,
   donde el texto de cada celda es diminuto. */
.itin-celda.fs,.itin-ren.fs{
  background-image:repeating-linear-gradient(45deg,
    var(--rojo-glow),var(--rojo-glow) 6px,transparent 6px,transparent 12px);
  border-color:rgba(194,46,36,.4);
}
.itin-celda.vacia.fs{border-style:solid}
/* En la columna de placas: el acceso de Coordinación a los días parados.
   La pantalla de Vehículos es solo del administrador, así que sin esto
   Coordinación no tendría desde dónde registrarlos. */
.fs-boton{
  display:block;margin-top:.2rem;padding:.1rem .3rem;border-radius:5px;cursor:pointer;
  font:700 .66rem 'Inter',sans-serif;text-align:left;
  background:none;border:1px dashed var(--border);color:var(--muted);width:100%;
}
.fs-boton:hover{border-color:var(--rojo);color:var(--rojo);border-style:solid}
.fs-boton.con{color:var(--rojo);border-color:rgba(194,46,36,.35);border-style:solid}
.fs-marca{
  display:inline-block;margin-top:.2rem;font:700 .58rem 'Inter',sans-serif;
  text-transform:uppercase;letter-spacing:.04em;color:var(--rojo);
  background:var(--surface);border:1px solid rgba(194,46,36,.3);
  border-radius:999px;padding:.05rem .35rem;white-space:nowrap;
}

/* Fichas del banco de predeterminados */
.pred-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
.pred-chip{
  border:1px solid var(--border);background:var(--surface-2);border-radius:999px;
  padding:.3rem .7rem;font:600 .78rem 'Inter',sans-serif;cursor:pointer;color:var(--text-soft);
}
.pred-chip:hover{border-color:var(--azul);color:var(--azul);background:var(--azul-glow)}
.pred-chip .veces{font-weight:500;color:var(--muted);font-size:.68rem;margin-left:.25rem}

/* Vista previa de la carga desde Excel */
.previa-fila{display:grid;grid-template-columns:auto 1fr;gap:.5rem;padding:.35rem .5rem;
  border-bottom:1px solid var(--border-soft);font-size:.8rem;align-items:baseline}
.previa-fila:last-child{border-bottom:0}
.previa-res{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.85rem}
.previa-res .r{border:1px solid var(--border);border-radius:var(--r);padding:.45rem .7rem;
  background:var(--surface-2);font-size:.8rem}
.previa-res .r b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}

/* ── Checklist ──────────────────────────────────────────────── */
.chk-item{
  display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;
  border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:.5rem;
}
.chk-item .nm{flex:1;font-weight:600;font-size:.87rem}
.chk-item select{width:auto;min-width:118px;padding:.35rem .5rem;font-size:.8rem}
.chk-sec{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:.9rem 0 .5rem}

/* ── Modal ──────────────────────────────────────────────────── */
.modal{
  position:fixed;inset:0;z-index:80;background:rgba(16,32,48,.45);
  display:none;align-items:flex-end;justify-content:center;padding:0;
}
.modal.on{display:flex}
@media(min-width:640px){.modal{align-items:center;padding:1.5rem}}
.modal-caja{
  background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;box-shadow:var(--sh-lg);animation:sale .2s ease;
}
@media(min-width:640px){.modal-caja{border-radius:var(--r-lg)}}
@keyframes sale{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal-cab{padding:1rem 1.1rem .75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-cab h3{flex:1}
.modal-cab button{background:none;border:0;cursor:pointer;color:var(--muted);padding:.25rem;line-height:0}
.modal-cpo{padding:1.1rem}
.modal-pie{padding:.85rem 1.1rem;border-top:1px solid var(--border);display:flex;gap:.5rem;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}

/* ── Avisos ─────────────────────────────────────────────────── */
#avisos{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;z-index:100;width:calc(100% - 2rem);max-width:420px;display:flex;flex-direction:column;gap:.5rem}
.aviso{
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--azul);
  border-radius:var(--r);padding:.7rem .85rem;box-shadow:var(--sh-md);font-size:.85rem;
  animation:sale .2s ease;
}
.aviso.ok{border-left-color:var(--verde)} .aviso.mal{border-left-color:var(--rojo)}
.aviso.avi{border-left-color:var(--ambar)}
.aviso b{display:block;margin-bottom:.1rem}

.nota{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .85rem;font-size:.82rem;color:var(--text-soft)}
.nota.avi{background:var(--ambar-glow);border-color:rgba(162,98,10,.25);color:#7a4a08}
.vacio{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.vacio svg{opacity:.35;margin-bottom:.5rem}
.cargando{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem}

#barra-offline{
  display:none;background:var(--ambar-glow);color:#7a4a08;border-bottom:1px solid rgba(162,98,10,.25);
  padding:.45rem 1rem;font-size:.78rem;font-weight:600;text-align:center;
}
#barra-offline.on{display:block}

#barra-version{
  display:none;background:var(--rojo-glow);color:#8c1f18;
  border-bottom:1px solid rgba(194,46,36,.3);
  padding:.55rem 1rem;font-size:.8rem;font-weight:600;text-align:center;
}
#barra-version.on{display:block}

/* ── Instalación en el teléfono ──────────────────────────────
   La franja azul aparece dentro de la aplicación cuando el navegador acepta
   instalar, y se puede cerrar. El botón del ingreso está antes de entrar,
   porque el conductor suele instalarla antes de tener usuario. */
#barra-instalar{
  display:none;background:var(--azul-glow);color:var(--azul-dark);
  border-bottom:1px solid rgba(30,90,168,.25);
  padding:.5rem .75rem;font-size:.8rem;font-weight:600;
  align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap;
}
#barra-instalar.on{display:flex}
#barra-instalar .cerrar{
  background:none;border:0;color:inherit;opacity:.6;cursor:pointer;
  font-size:1.1rem;line-height:1;padding:.1rem .3rem;
}
#barra-instalar .cerrar:hover{opacity:1}

#barra-nueva{
  display:none;background:var(--verde-glow);color:#065c40;
  border-bottom:1px solid rgba(10,125,87,.25);
  padding:.5rem .75rem;font-size:.8rem;font-weight:600;
  align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap;
}
#barra-nueva.on{display:flex}

#instalar-ingreso{margin-top:.9rem;text-align:center}
#instalar-ingreso button{
  width:100%;background:var(--azul-glow);border:1px solid rgba(30,90,168,.25);
  color:var(--azul-dark);font:600 .8rem/1.3 inherit;border-radius:var(--r);
  padding:.6rem .75rem;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:.45rem;
}
#instalar-ingreso button:hover{background:rgba(30,90,168,.14)}

/* Crédito de quien desarrolla, en el ingreso: misma firma que el pie de la
   aplicación, para que se lea igual antes y después de entrar. */
.credito{
  margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:center;gap:.45rem;
}
.credito span{font-size:.68rem;font-weight:600;color:var(--muted)}
.credito img{width:104px;height:auto;display:block;opacity:.92}

/* Pie de la aplicación: la firma de quien desarrolla, debajo de cualquier
   pantalla. Va fuera de <main> para no repetirla en cada vista ni tener que
   acordarse de ponerla al escribir una nueva. */
.pie{
  display:flex;align-items:center;justify-content:center;gap:.45rem;
  padding:1.1rem 1rem calc(1.1rem + env(safe-area-inset-bottom));
  border-top:1px solid var(--border-soft);background:var(--surface);
}
.pie span{font-size:.68rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.pie img{width:104px;height:auto;display:block;opacity:.92}

/* Pasos ilustrados del instructivo "cómo instalar" */
.pasos{margin:0;padding-left:1.15rem;font-size:.86rem;line-height:1.65}
.pasos li{margin-bottom:.35rem}
.pasos b{color:var(--azul-dark)}

/* ── Ingreso ────────────────────────────────────────────────── */
#ingreso{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(1.25rem,env(safe-area-inset-top)) 1.25rem max(1.25rem,env(safe-area-inset-bottom));background:linear-gradient(165deg,#eef2f7,#f6f8fa 55%,#eef4f2)}
#ingreso .caja{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh-lg);padding:1.75rem 1.5rem}
#ingreso .logo{display:flex;align-items:center;gap:.6rem;margin-bottom:.25rem}
#ingreso h1{font-size:1.3rem}
#ingreso .lema{color:var(--muted);font-size:.78rem;margin:.15rem 0 1.35rem}
.grafica-env{position:relative;height:260px}

/* ── Banner institucional ─────────────────────────────────────────── */
.banner{width:100%;line-height:0;background:#fff}
.banner img{width:100%;height:auto;display:block}
.banner-ingreso{border-radius:12px;overflow:hidden;margin-bottom:1rem;border:1px solid var(--border)}
.banner-cabecera{border-bottom:1px solid var(--border)}
/* En el celular el banner se recorta en alto para no comerse la pantalla */
@media(max-width:700px){
  .banner-cabecera{max-height:52px;overflow:hidden;display:flex;align-items:center}
}

/* ── Arrastre táctil ──────────────────────────────────────────────── */
.fantasma{
  position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-130%);
  background:var(--azul);color:#fff;padding:.3rem .6rem;border-radius:8px;
  font:700 .74rem 'Inter',sans-serif;box-shadow:var(--sh-md);max-width:170px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.itin-celda{touch-action:pan-x pan-y}
.pred-chip.activo{background:var(--azul);color:#fff;border-color:var(--azul)}
#itin-env.pintando .itin-celda{cursor:crosshair}
#itin-env.pintando .itin-celda:hover{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-glow)}

/* ── Celular ──────────────────────────────────────────────────────── */
@media(max-width:700px){
  main{padding:.75rem}
  h1{font-size:1.25rem}
  .cab{gap:.6rem}
  .kpi .val{font-size:1.4rem}
  .modal-caja{max-height:94vh}
  .modal-pie{flex-wrap:wrap}
  .modal-pie .btn{flex:1 1 auto;justify-content:center}
  .btn{padding:.6rem 1rem}          /* objetivos táctiles más grandes */
  .btn.sm{padding:.45rem .7rem}
  .inp,select.inp{font-size:16px}   /* evita el zoom automático de iOS */
  .nav button{padding:.7rem .55rem;font-size:.78rem}
  table{font-size:.8rem}
  .previa-res{gap:.35rem}
  .previa-res .r{flex:1 1 40%}
}
/* El notch y la barra inferior de los iPhone */
@supports(padding:max(0px)){
  .topbar{padding-left:max(1rem,env(safe-area-inset-left));padding-right:max(1rem,env(safe-area-inset-right))}
  main{padding-bottom:max(1rem,env(safe-area-inset-bottom))}
}
/* ── Itinerario en el celular ────────────────────────────────────────
   Dos presentaciones del MISMO itinerario editable, y se alterna entre
   ellas con el botón de la cabecera:
     · «Matriz»   — la tabla de escritorio, con desplazamiento lateral.
     · «Por día»  — un día a la vez, con TODOS los vehículos en vertical
                    y los libres como ranura para adjudicar.
   Antes, por debajo de 700 px salía una lista de solo lectura que no
   mostraba los vehículos libres: desde el celular no había dónde tocar
   para adjudicar un traslado. */

/* Tira de días: se escoge el día que se va a programar */
.tira-dias{
  display:flex;gap:.3rem;overflow-x:auto;padding:.15rem .1rem .4rem;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.tira-dias::-webkit-scrollbar{display:none}
.tira-dias .d{
  flex:0 0 auto;min-width:46px;padding:.3rem .15rem;border-radius:9px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);text-align:center;
  font:600 .68rem 'Inter',sans-serif;color:var(--text-soft);line-height:1.25;
}
.tira-dias .d .n{display:block;font-size:.98rem;font-weight:800;color:var(--text)}
.tira-dias .d .c{display:block;font-size:.6rem;color:var(--muted);font-weight:700}
.tira-dias .d.hoy{border-color:var(--azul)}
.tira-dias .d.on{background:var(--azul);border-color:var(--azul);color:#fff}
.tira-dias .d.on .n,.tira-dias .d.on .c{color:#fff}

/* Cabecera del día escogido */
.dia-nav{
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  margin:.2rem 0 .5rem;
}
.dia-nav .tit{font:800 .95rem 'Inter',sans-serif;text-align:center;flex:1}
.dia-nav .tit small{display:block;font-weight:600;font-size:.72rem;color:var(--muted)}

/* Renglones: un vehículo, ocupado o libre */
.itin-ren{
  display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);margin-bottom:.35rem;cursor:pointer;
}
.itin-ren:active{border-color:var(--azul)}
.itin-ren .pl{font-weight:700;min-width:74px;font-size:.82rem}
.itin-ren .de{flex:1;font-size:.85rem;min-width:0}
.itin-ren .sub{font-size:.74rem;color:var(--muted)}
.itin-ren.ebs{border-left:3px solid var(--azul)}
.itin-ren.jornada{border-left:3px solid var(--morado)}
.itin-ren.vacunacion{border-left:3px solid var(--verde)}
.itin-ren.disponible{border-left:3px solid var(--muted)}
.itin-ren.traslado_ciudad{border-left:3px solid var(--ambar)}
.itin-ren.administrativo{border-left:3px solid var(--border)}
.itin-ren.bloqueada{background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(16,32,48,.035) 5px,rgba(16,32,48,.035) 10px)}
/* La ranura vacía: es lo que faltaba para poder adjudicar desde el celular */
.itin-ren.libre{background:transparent;border-style:dashed}
.itin-ren .mas{
  font:700 .78rem 'Inter',sans-serif;color:var(--azul);white-space:nowrap;
  background:var(--azul-glow);border-radius:999px;padding:.25rem .6rem;
}
#itin-dia.pintando .itin-ren{cursor:crosshair}
.dia-res{font-size:.75rem;color:var(--muted);margin:0 0 .45rem}

/* En el celular la matriz se aprieta un poco: cada día que quepa de más
   es un desplazamiento lateral menos. */
.itin-th-veh{position:sticky;left:0;background:var(--surface-2);z-index:2;min-width:150px}
.itin-td-veh{position:sticky;left:0;background:var(--surface);z-index:1;
  border-right:1px solid var(--border);min-width:150px}
.cond-fila{font-size:.72rem;color:var(--muted)}
@media(max-width:700px){
  .itin-celda{min-width:92px;font-size:.7rem;padding:.35rem .38rem}
  .itin-th-veh,.itin-td-veh{min-width:104px}
  /* En una columna estrecha «JACID ANTONIO MUÑOZ» parte en tres renglones y
     estira la fila entera; el nombre completo queda en el texto emergente. */
  .cond-fila{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;line-height:1.2;
  }
  /* Las fichas del pincel en una sola fila que se desliza, no en seis renglones */
  .pincel-fila{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none}
  .pincel-fila::-webkit-scrollbar{display:none}
  .pincel-fila>*{flex:0 0 auto}
}

/* Mover una programación desde la ventana, sin arrastrarla.
   Con el dedo el arrastre exige sostener 350 ms y soltar sobre una celda que
   suele estar fuera de pantalla; aquí se escoge día y vehículo de una lista. */
.mover-bloque{
  border:1px solid var(--border);border-radius:var(--r);padding:.55rem .7rem;
  margin-bottom:.9rem;background:var(--surface-2);
}
.mover-bloque>summary{
  cursor:pointer;font:700 .8rem 'Inter',sans-serif;color:var(--azul);list-style:none;
}
.mover-bloque>summary::-webkit-details-marker{display:none}
.mover-bloque>summary::before{content:'⇄  '}
.mover-bloque[open]>summary{margin-bottom:.2rem}
@media(min-width:560px){.mover-bloque .g2{grid-template-columns:1fr 1fr}}
.ayuda{font-size:.75rem;color:var(--muted);margin:.45rem 0 0}
.ayuda.mal{color:var(--ambar);font-weight:600}

/* ── Pantalla de Viajes: filtros y ficha ─────────────────────────────
   Es la pantalla donde se verifica, así que el período es libre —hasta toda
   la operación— y los filtros trabajan sobre lo ya descargado. */
.filtros-tray{padding:.7rem .85rem;margin-bottom:.85rem}
/* El consecutivo en una sola línea: partido en tres estiraba toda la fila */
.btn-viaje{white-space:nowrap;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.7rem}
/* Un viaje anulado sigue listado para el administrador, pero se ve que no cuenta */
tr.fila-anulada{opacity:.55}
tr.fila-anulada td{text-decoration:line-through;text-decoration-color:var(--rojo)}
tr.fila-anulada .etq,tr.fila-anulada button{text-decoration:none}
.filtros-tray .fila{
  display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap;
}
.filtros-tray .fila + .fila{margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--border)}
.filtros-tray .inp{width:auto}
.filtros-tray .chips{gap:.3rem;margin:0}
.filtros-tray .chip{padding:.3rem .6rem;font-size:.74rem}
.marca-check{
  display:flex;align-items:center;gap:.35rem;font-size:.8rem;cursor:pointer;
  color:var(--text-soft);padding-bottom:.45rem;white-space:nowrap;
}

/* Ficha de un viaje: etiqueta a la izquierda, dato a la derecha */
table.ficha{width:100%;border-collapse:collapse}
table.ficha th{
  text-align:left;vertical-align:top;white-space:nowrap;width:1%;
  padding:.3rem .7rem .3rem 0;font:600 .76rem 'Inter',sans-serif;color:var(--muted);
}
table.ficha td{padding:.3rem 0;font-size:.86rem;border-bottom:1px solid var(--border)}
table.ficha th{border-bottom:1px solid var(--border)}
.ficha-tit{
  font:800 .78rem 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.05em;
  color:var(--azul);margin:1.1rem 0 .3rem;
}

/* Coordenadas copiables en la pantalla de viajes */
.geo{min-width:132px}
.geo-copiar{
  font:600 .72rem/1.2 ui-monospace,'SF Mono',Menlo,monospace;
  background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
  padding:.22rem .4rem;cursor:pointer;color:var(--text);white-space:nowrap;
}
.geo-copiar:hover{border-color:var(--azul);color:var(--azul);background:var(--azul-glow)}
.geo-copiar::after{content:' ⧉';opacity:.5}
</style>
</head>
<body>

<!-- ══ INGRESO ══════════════════════════════════════════════ -->
<div id="ingreso">
  <form class="caja" onsubmit="entrar(event)">
    <div id="banner-ingreso" class="banner banner-ingreso" style="display:none"></div>
    <div class="logo">
      <img class="marca-logo" src="iconos/marca.png" width="40" height="40"
           alt="Flota Vehicular">
      <div><h1>Flota Vehicular</h1></div>
    </div>
    <p class="lema">ESE Hospital Regional Noroccidental · Misión Médica</p>
    <div class="campo">
      <label class="lb" for="in-usuario">Usuario</label>
      <input class="inp" id="in-usuario" autocomplete="username" autocapitalize="none" required>
    </div>
    <div class="campo">
      <label class="lb" for="in-clave">Clave</label>
      <input class="inp" id="in-clave" type="password" autocomplete="current-password" required>
    </div>
    <div id="in-error" class="nota avi" style="display:none;margin-bottom:.75rem"></div>
    <button class="btn bloque" id="in-btn" type="submit">Entrar</button>
    <div id="instalar-ingreso"></div>
    <p style="text-align:center;margin:.9rem 0 0;font-size:.72rem;color:var(--muted)">
      ¿Problemas para entrar? Comuníquese con la Coordinación de Salud Pública.
    </p>
    <div class="credito">
      <span>By</span>
      <img src="iconos/pascalia.png" alt="PascalIA" width="454" height="120">
    </div>
  </form>
</div>

<!-- ══ APLICACIÓN ═══════════════════════════════════════════ -->
<div id="app" hidden>
  <div id="banner-cabecera" class="banner banner-cabecera" style="display:none"></div>
  <header class="topbar">
    <div class="marca">
      <img class="marca-logo" src="iconos/marca.png" width="28" height="28" alt="">
      <div>Flota Vehicular<span class="sub">ESE HRNO · Misión Médica</span></div>
    </div>
    <div class="der">
      <span class="chip-rol" id="tb-rol"></span>
      <button class="btn sec sm" onclick="salir()">Salir</button>
    </div>
  </header>
  <div id="barra-offline">Sin conexión · <span id="offline-n">0</span> marca(s) guardada(s) en el celular, se enviarán solas</div>
  <div id="barra-version"></div>
  <div id="barra-instalar"></div>
  <div id="barra-nueva"></div>
  <nav class="nav" id="nav"></nav>
  <main id="main"></main>
  <footer class="pie">
    <span>By</span>
    <img src="iconos/pascalia.png" alt="PascalIA" width="454" height="120">
  </footer>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)cerrarModal()">
  <div class="modal-caja">
    <div class="modal-cab"><h3 id="modal-tit"></h3>
      <button onclick="cerrarModal()" aria-label="Cerrar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-cpo" id="modal-cpo"></div>
    <div class="modal-pie" id="modal-pie"></div>
  </div>
</div>

<div id="avisos"></div>
<script src="libs/chart.umd.min.js"></script>
<script src="libs/xlsx.full.min.js"></script>
<script src="libs/jszip.min.js"></script>
<script src="libs/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
